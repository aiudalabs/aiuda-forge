# Production override — layer on top of the base docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# It adds Caddy (automatic HTTPS + reverse proxy on ONE domain), bakes the public API URL
# into the console build, and points the control's public/callback URLs at the domain.
#
# Requires FLUXO_DOMAIN in .env (e.g. FLUXO_DOMAIN=fluxo.aiudalabs.com) and DNS: an A record
# for FLUXO_DOMAIN → this VPS's public IP, before first boot (Caddy needs it to issue TLS).
#
# PROD PREREQUISITES (see DEPLOY.md): set VIBEFORGE_PREVIEW_SECRET in .env (else preview links
# die on every restart), and build the sandbox image ONCE before `up`:
#   ./engine/scripts/build-sandbox-images.sh
# The registry bind-mount (base file) is writable so the retro can edit the method — on a
# single VPS an approved retro leaves uncommitted changes under engine/registry/ to commit.
#
# The control (8080) and console (3000) host ports from the base file stay bound to the
# host — close them at the firewall so only 80/443 (Caddy) are public (see DEPLOY.md).

name: aiuda-forge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Required: without it every ${FLUXO_DOMAIN} below expands empty → the control would boot
      # with VIBEFORGE_PUBLIC_URL=https:///forge-api (malformed) and Caddy couldn't issue TLS.
      # Fail at `compose config` instead. Set FLUXO_DOMAIN in .env (e.g. fluxo.aiudalabs.com).
      FLUXO_DOMAIN: "${FLUXO_DOMAIN:?required — set FLUXO_DOMAIN in .env, e.g. fluxo.aiudalabs.com (DEPLOY.md section 4)}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - forge-internal
    depends_on:
      - console
      - control

  control:
    environment:
      # Same origin as the console → CORS isn't triggered, but set it explicitly anyway.
      VIBEFORGE_CORS_ORIGIN: https://${FLUXO_DOMAIN}
      # Public base of the control plane (GitHub App manifest + OAuth callbacks): behind
      # Caddy the control lives under /forge-api.
      VIBEFORGE_PUBLIC_URL: https://${FLUXO_DOMAIN}/forge-api
      VIBEFORGE_CONSOLE_URL: https://${FLUXO_DOMAIN}

  console:
    build:
      args:
        # Baked into the JS the browser runs (see console/Dockerfile). Same-origin path.
        NEXT_PUBLIC_VIBEFORGE_API_URL: https://${FLUXO_DOMAIN}/forge-api
    environment:
      # Mirror of the build arg (a no-op for the browser — NEXT_PUBLIC_* is inlined at build —
      # but keeps the running container's env self-describing instead of empty).
      NEXT_PUBLIC_VIBEFORGE_API_URL: https://${FLUXO_DOMAIN}/forge-api

volumes:
  caddy-data:
  caddy-config:
