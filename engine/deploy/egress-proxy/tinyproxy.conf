# Forward-proxy with a default-deny domain allowlist (ported from v1's
# deploy/egress-proxy). The agent sandbox reaches the LLM API ONLY through this
# proxy (HTTPS_PROXY); everything not in /etc/tinyproxy/filter is rejected.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Who may USE the proxy: the internal sandbox network (no internet gateway).
Allow 0.0.0.0/0

# Allowlist of DESTINATIONS: default-deny + only what matches the filter.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off

# HTTPS via CONNECT (the filter applies to the CONNECT host).
ConnectPort 443
ConnectPort 8443

LogLevel Info
