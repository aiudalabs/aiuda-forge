# The real factory flow — defined ENTIRELY in data. The kernel runs this with no
# flow-specific Go. To add a step (e.g. a `simplify` agent, or `agentic_verify`),
# edit THIS file — no recompile. That editability is the v2 success criterion.
id: factory
version: 1.0.0
steps:
  - id: implement
    type: agent
    agent: dev                  # static fallback; the per-lane specialist below overrides it
    inputs:
      ticket: $trigger.ticket
      agent: $trigger.agent      # lane routing: the story's owner (python-dev, react-dev…); empty -> falls back to `dev`

  - id: gate
    type: gate
    command_from: repo          # runs the target repo's .vibeforge-gate in the sandbox
    on_fail:
      goto: implement           # gate red -> back to dev with the failure as feedback
      max: 2
      feedback: $gate.detail

  - id: review
    type: agentic_verify         # BLOCKING: a "broken" verdict fails the step
    agent: reviewer
    model: claude-sonnet-4-6     # CROSS-MODEL: different model than the implementer (opus)
    prompt: adversarial
    inputs:
      ticket: $trigger.ticket
      diff_hint: "Review the working tree changes that just passed the gate."
    on_fail:
      goto: implement            # review found a real defect -> back to dev with the evidence
      max: 2
      feedback: $review.detail

  - id: pr
    type: pr
    approval: risk-policy        # low risk -> auto; high -> human_gate (Wave 6)
    inputs:
      base: dev                  # GitHub Flow: the factory targets `dev` (mirrors design.yaml's docs_pr)
      ticket: $trigger.ticket
