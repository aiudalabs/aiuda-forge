# Design workflow — the product design process as a registry-defined YAML workflow.
# Each phase is a `design` step (no sandbox, produces a doc) followed by a human_gate
# that parks execution until a human approves. On rejection the gate loops back to the
# phase step with the reviewer's feedback injected as $<gate>.detail.
#
# Phase order: discovery → PRD → architecture → UI → mockups → backlog → handoff → docs_pr
id: design
version: 1.0.0
steps:
  # ── Phase 1: Discovery ────────────────────────────────────────────────────
  - id: discovery
    type: design
    agent: analyst
    inputs:
      instructions: $trigger.instructions
      output: docs/BRIEF.md

  - id: discovery_gate
    type: human_gate
    inputs:
      reason: "Review the project brief (docs/BRIEF.md). Approve to proceed to PRD, or reject with feedback."
    on_fail:
      goto: discovery
      max: 100
      feedback: $discovery_gate.detail

  # ── Phase 2: PRD ──────────────────────────────────────────────────────────
  - id: prd
    type: design
    agent: pm
    inputs:
      brief: $discovery.text
      instructions: $trigger.instructions
      output: docs/PRD.md

  - id: prd_gate
    type: human_gate
    inputs:
      reason: "Review the PRD (docs/PRD.md). Approve to proceed to architecture, or reject with feedback."
    on_fail:
      goto: prd
      max: 100
      feedback: $prd_gate.detail

  # ── Phase 3: Architecture ─────────────────────────────────────────────────
  - id: architecture
    type: design
    agent: architect
    inputs:
      prd: $prd.text
      output: docs/ARCHITECTURE.md

  - id: arch_gate
    type: human_gate
    inputs:
      reason: "Review the architecture (docs/ARCHITECTURE.md). Approve to proceed to UI, or reject with feedback."
    on_fail:
      goto: architecture
      max: 100
      feedback: $arch_gate.detail

  # ── Phase 4: UI / Screens ─────────────────────────────────────────────────
  - id: ui
    type: design
    agent: ux
    inputs:
      prd: $prd.text
      architecture: $architecture.text
      output: docs/UI_SCREENS.md

  - id: ui_gate
    type: human_gate
    inputs:
      reason: "Review the UI spec (docs/UI_SCREENS.md). Approve to proceed to mockups, or reject with feedback."
    on_fail:
      goto: ui
      max: 100
      feedback: $ui_gate.detail

  # ── Phase 5: Mockups — one HTML per surface ──────────────────────────────
  # The designer reads the spec files directly (paths, not content) to keep the
  # initial prompt small (~5k instead of ~80k). It writes one HTML file per app
  # surface into docs/mockups/ (passenger, driver, admin, etc.).
  - id: mockups
    type: design
    agent: designer
    inputs:
      screens_path: docs/UI_SCREENS.md
      prd_path: docs/PRD.md
      output: docs/mockups/index.html

  - id: mockups_gate
    type: human_gate
    inputs:
      reason: "Revisa los mockups en docs/mockups/ (un HTML por superficie de la app). Aprueba o pide cambios."
    on_fail:
      goto: mockups
      max: 100
      feedback: $mockups_gate.detail

  # ── Phase 6: Backlog ──────────────────────────────────────────────────────
  - id: backlog
    type: design
    agent: scrum-master
    inputs:
      prd: $prd.text
      architecture: $architecture.text
      output: docs/backlog.yaml
    on_fail:
      # A failed/timed-out backlog generation must NOT nuke the whole design run
      # (#15). The two-level backlog already keeps this step light, but a large
      # project can still exceed the agent timeout — retry once, hinting the
      # scrum-master to stay lean (over-generation is the usual cause).
      goto: backlog
      max: 1
      feedback: "La generación anterior del backlog falló o excedió el tiempo. Genera un backlog MÁS LEAN y enfocado al MVP: prioriza el happy-path central, agrupa en menos sprints y difiere lo nice-to-have. Mantén el nivel de ESQUELETO (título + user-story + acceptance + deps + owner + sprint) — sin specs de implementación; esas las expande el story-detailer just-in-time."

  - id: backlog_gate
    type: human_gate
    inputs:
      reason: "Review the backlog (docs/backlog.yaml). Approve to publish to the ticket store, or reject with feedback."
    on_fail:
      goto: backlog
      max: 100
      feedback: $backlog_gate.detail

  # ── Phase 7: Handoff — publish backlog into the native ticket store ───────
  - id: handoff
    type: ticket_publish
    inputs:
      backlog: docs/backlog.yaml
      repo: $trigger.repo
      project_id: $trigger.project_id   # scope every published story/sprint to the project (audit A1)

  # ── Phase 8: Publish docs — commit docs/ to a branch and open a PR to dev ─
  # Requires the run's workdir to be a clone of the project repo (payload.repo).
  # PR_MODE=github opens a real GitHub PR against the `dev` branch.
  - id: docs_pr
    type: pr
    inputs:
      # main, no dev: los agentes GitHub-native (Copilot/Claude) trabajan sobre
      # main — el PRD/arquitectura/design-system deben ser visibles ahí.
      # (dev era el modelo two-branch del factory legacy.)
      base: main
      ticket: "design: publish docs for review"
