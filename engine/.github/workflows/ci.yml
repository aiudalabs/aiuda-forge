name: ci
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run the gate (mirror of .vibeforge-gate)
        run: |
          go build ./...
          go vet ./...
          go test ./...
