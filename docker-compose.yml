name: aiuda-forge

# ── DooD note ────────────────────────────────────────────────────────────────
# The control service spawns agent containers at runtime via the host Docker
# socket (Docker-outside-of-Docker). For this to work, FORGE_WORKDIR must be
# the SAME absolute path on the host AND inside the control container so that
# `docker run -v <path>:/work` resolves correctly from the host daemon.
#
# On macOS with Docker Desktop, paths under /Users, /tmp, /private are shared
# automatically. The default in .env.example uses /tmp/vibeforge-runs.
# For persistence across reboots, use a path under /Users.
#
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker compose up --build

services:

  # ── Control plane (API + queue + agent runner) ─────────────────────────────
  control:
    build:
      context: ./engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - forge-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # DooD workdir: same absolute path on host and in container (see note above)
      - ${FORGE_WORKDIR}:${FORGE_WORKDIR}
      # The registry (methodology = data) is bind-mounted so (a) host edits to
      # workflows/agents/skills are live in the running control WITHOUT a rebuild, and
      # (b) the retro ceremony's `registry_apply` step (PR #27) can WRITE improved
      # agents/skills/workflows back — the method improves itself, gated by a human
      # sprint-retro approval, validated (id allowlist, path-escape blocked, no self-edit
      # of the retro method) and audited (one event per write). It MUST be writable —
      # a read-only mount makes retro fail with "registry_apply: write ...: read-only
      # file system" (clean failure, no panic) and the retro never stamps.
      # DEV-LOOP / SINGLE-VPS WARNING: this binds the git checkout, so an approved retro
      # leaves UNCOMMITTED changes under engine/registry/ in the host working tree —
      # review and commit them as `retro(SP<n>): método editado` (the git trail of the
      # method is desirable, not an accident). See DEPLOY.md §"El registry es escribible".
      - ./engine/registry:/app/registry
      # Static release previews (PR #23): a named volume, NOT the container's ephemeral
      # layer, so preview sites survive restarts/redeploys (served under /pv/{token}/).
      - forge-previews:/previews
    environment:
      VIBEFORGE_ADDR: ":8080"
      VIBEFORGE_DB: /data/vibeforge.db
      VIBEFORGE_TICKETS_DB: /data/tickets.db
      VIBEFORGE_PROJECTS_DB: /data/projects.db
      VIBEFORGE_AUTH_DB: /data/auth.db
      VIBEFORGE_REGISTRY: /app/registry
      VIBEFORGE_WORKDIR: ${FORGE_WORKDIR}
      VIBEFORGE_SANDBOX_NETWORK: vibeforge-egress
      VIBEFORGE_AGENT_IMAGE: ${VIBEFORGE_AGENT_IMAGE:-vibeforge-agent:local}
      VIBEFORGE_ENGINE: ${VIBEFORGE_ENGINE:-claude}
      VIBEFORGE_SANDBOX: ${VIBEFORGE_SANDBOX:-docker}
      VIBEFORGE_CORS_ORIGIN: ${VIBEFORGE_CORS_ORIGIN:-http://localhost:3000}
      VIBEFORGE_API_TOKEN: ${VIBEFORGE_API_TOKEN}
      VIBEFORGE_ADMIN_EMAIL: ${VIBEFORGE_ADMIN_EMAIL}
      VIBEFORGE_ADMIN_PASSWORD: ${VIBEFORGE_ADMIN_PASSWORD}
      VIBEFORGE_AGENT_AUTH: ${VIBEFORGE_AGENT_AUTH:-oauth_token}
      VIBEFORGE_GH_ORG: ${VIBEFORGE_GH_ORG}
      # Onboarding GitHub (Forja): URLs públicas + credenciales de la App
      VIBEFORGE_PUBLIC_URL: ${VIBEFORGE_PUBLIC_URL:-http://localhost:8080}
      VIBEFORGE_CONSOLE_URL: ${VIBEFORGE_CONSOLE_URL:-http://localhost:3000}
      VIBEFORGE_GHAPP_CREDS: /data/github-app.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Brain (in-app assistant) LLM — the master orchestrator reasons better on Opus
      # (judgment-heavy work); the Brain activates only when ANTHROPIC_API_KEY is set.
      BRAIN_MODEL: ${BRAIN_MODEL:-claude-opus-4-8}
      GH_TOKEN: ${GH_TOKEN:-}
      TARGET_REMOTE: ${TARGET_REMOTE:-}
      # PR mode for the `pr` step type. The DESIGN docs_pr runs HERE (design phase runs in the
      # control), so this MUST default to github in prod — else docs_pr commits+pushes a branch
      # but never opens/merges the PR, docs never reach `main`, and sprints dispatch blind
      # (reservas-belleza incident 2026-07-06). local = offline dev/tests only.
      PR_MODE: ${PR_MODE:-github}
      # Operability (audit A3/A5): cap every gh/git shell-out so a hung call can't stall
      # the conductor for all tenants; GC events + terminal-run workdirs older than N days
      # (0 disables) so disk doesn't grow without bound.
      VIBEFORGE_GH_TIMEOUT_SEC: ${VIBEFORGE_GH_TIMEOUT_SEC:-90}
      VIBEFORGE_RETENTION_DAYS: ${VIBEFORGE_RETENTION_DAYS:-30}
      # ── Release previews (PR #23) ────────────────────────────────────────────
      # Previews land on the forge-previews volume (see volumes above). The build
      # itself runs in the sandbox image (VIBEFORGE_AGENT_IMAGE), not here.
      VIBEFORGE_PREVIEWS_DIR: /previews
      # REQUIRED IN PROD: HMAC key that signs the short-lived preview-capability tokens.
      # If empty, a random per-process key is generated → EVERY preview link stops
      # working after a control restart. Generate: `openssl rand -hex 32`.
      VIBEFORGE_PREVIEW_SECRET: ${VIBEFORGE_PREVIEW_SECRET:-}
      # Release build tuning (defaults shown): per-build timeout, max published artifact, previews kept/project.
      VIBEFORGE_RELEASE_BUILD_TIMEOUT_MIN: ${VIBEFORGE_RELEASE_BUILD_TIMEOUT_MIN:-10}
      VIBEFORGE_RELEASE_MAX_MB: ${VIBEFORGE_RELEASE_MAX_MB:-200}
      VIBEFORGE_RELEASE_KEEP: ${VIBEFORGE_RELEASE_KEEP:-5}
      # ── Ceremonies / conductor (PR #18/#19/#26) ──────────────────────────────
      # Daily standup digest (#19): the cron is evaluated in UTC — the container TZ is
      # IGNORED. Default `0 13 * * *` = 13:00 UTC (08:00 Panamá). The Telegram bot token
      # and each project's digest channel are configured IN-APP (Settings → Telegram
      # token; per-project digest channel), NOT via env.
      VIBEFORGE_DIGEST_CRON: ${VIBEFORGE_DIGEST_CRON:-0 13 * * *}
      # JIT grooming (#18): dev-ready spec + visual + components pre-dispatch. "0" disables.
      VIBEFORGE_CONDUCTOR_GROOM: ${VIBEFORGE_CONDUCTOR_GROOM:-1}
      # Design-agent wall-clock (#14) and idle watchdog (#26), in minutes.
      VIBEFORGE_AGENT_TIMEOUT_MIN: ${VIBEFORGE_AGENT_TIMEOUT_MIN:-20}
      VIBEFORGE_AGENT_IDLE_TIMEOUT_MIN: ${VIBEFORGE_AGENT_IDLE_TIMEOUT_MIN:-8}
      # GitHub webhook secret — optional; only if you enable the App's webhooks (DEPLOY.md §6).
      # (The control reads this; it was previously declared in .env but never reached the container.)
      VIBEFORGE_GITHUB_WEBHOOK_SECRET: ${VIBEFORGE_GITHUB_WEBHOOK_SECRET:-}
    networks:
      - forge-internal
    depends_on:
      - egress-proxy
    # Resource cap: the design-phase agents (`claude -p`) run INSIDE this container, so a
    # burst of concurrent design steps could otherwise starve the host. Sized for a
    # 4 vCPU / 8 GB VPS (leaves room for console + egress + OS); tune to your box.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 4G

  # ── Native orchestrator (LEGACY factory scheduler) ──────────────────────────
  # DESHABILITADO por default: el pivote GitHub-native lo reemplazó por el CONDUCTOR
  # (internal/conductor, dentro de control). Correr ambos hace que peleen por las
  # mismas stories: el conductor las pone `running` (assignee de Copilot / label
  # agent:running de claude_action) y el native-scheduler las resetea a `backlog`
  # (regla B4: "running with no run_id"), causando el flap ready/running en la UI.
  # Detrás del profile `legacy` para no arrancar con un `docker compose up` normal;
  # sólo `docker compose --profile legacy up` lo levanta (para pruebas del factory v1).
  orchestrator:
    profiles: ["legacy"]
    build:
      context: ./engine
    restart: unless-stopped
    command: ["./orchestrator", "-source", "native", "-workflow", "factory"]
    volumes:
      - ${FORGE_WORKDIR}:${FORGE_WORKDIR}
    environment:
      VIBEFORGE_API_TOKEN: ${VIBEFORGE_API_TOKEN}
      VIBEFORGE_ADDR: http://control:8080
      GH_TOKEN: ${GH_TOKEN:-}
      PR_MODE: ${PR_MODE:-github}
    networks:
      - forge-internal
    depends_on:
      - control

  # ── Egress proxy (tinyproxy, default-deny allowlist) ──────────────────────
  # Dual-homed: reaches internet via forge-internet, is reachable by agent
  # containers via the internal vibeforge-egress network only.
  egress-proxy:
    build:
      context: ./engine/deploy/egress-proxy
    restart: unless-stopped
    networks:
      - forge-internet
      - vibeforge-egress

  # ── Console (Next.js) ──────────────────────────────────────────────────────
  console:
    build:
      context: ./console
      args:
        FORGE_API_INTERNAL: http://control:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      FORGE_API_INTERNAL: http://control:8080
      NEXT_PUBLIC_VIBEFORGE_API_URL: ${NEXT_PUBLIC_VIBEFORGE_API_URL:-http://localhost:8080}
    depends_on:
      - control
    networks:
      - forge-internal

volumes:
  # Persistent SQLite data (vibeforge.db, tickets.db, projects.db, auth.db,
  # brain.db, billing.db — all open relative to VIBEFORGE_DB directory).
  forge-data:
    driver: local

  # Persistent static release previews (PR #23). Regenerable from a re-run, but kept
  # off the container's ephemeral layer so preview links survive restarts/redeploys.
  forge-previews:
    driver: local

networks:
  # Internal network between control and console (no internet access).
  forge-internal:
    driver: bridge

  # Internet-facing network — only the egress-proxy is attached here.
  forge-internet:
    driver: bridge

  # Internal-only network for agent sandboxes. No internet gateway.
  # Agent containers join this network and reach the LLM via egress-proxy only.
  vibeforge-egress:
    name: vibeforge-egress
    driver: bridge
    internal: true
